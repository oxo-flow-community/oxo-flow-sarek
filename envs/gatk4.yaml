# Upstream nf-core/sarek module env (conda equivalent of the wave.seqera.io
# community image, gcnvkernel included in gatk4). Channel NAMES only -
# CN users point conda at a domestic mirror, international users use the
# defaults. Companion versions unpinned for solver alignment.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - gatk4=4.5.0.0
  - samtools
  - htslib
  # the gatk launcher script is python (spawns the JVM) — without a
  # python in the env it dies with "env: 'python': No such file"
  # python 3.6 (not newer): CNNScoreVariants runs its scoring python
  # inline, and the bundled 1D CNN model was saved with keras 2.0.6
  # (read from the hd5: keras_version 2.0.6, backend theano) — the
  # theano-backed keras needs python <=3.6-era conda builds. The gatk
  # launcher is happy on 3.6. (nf-core itself: "CNNSCOREVARIANTS does
  # not support Conda" — this env IS that stack, pinned.)
  - python=3.6
  # CNNScoreVariants: 'A required Python package ("gatktool") could not
  # be imported' — gatktool 0.0.1 declares only python; its real deps
  # must be pinned explicitly to the model's native era:
  - gatktool
  - keras=2.0.6
  - theano=0.9.0
  - h5py=2.7.1
