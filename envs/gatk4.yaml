# Upstream nf-core/sarek module env (conda equivalent of the wave.seqera.io
# community image, gcnvkernel included in gatk4). Channel NAMES only -
# CN users point conda at a domestic mirror, international users use the
# defaults.
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - gatk4=4.5.0.0
  - samtools=1.24
  - htslib=1.24
