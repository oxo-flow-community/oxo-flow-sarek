# Upstream nf-core/sarek 3.12.0 varlociraptor module envs (per-module
# environment.yml pins: bioconda::varlociraptor=8.12.0, bumped from 8.9.5
# upstream-side together with the --atomic-candidate-variants preprocess
# flag). htslib/samtools bundled for the in-module CRAM handling and index
# steps, bcftools for the merge/concat calls around the generic call leg.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::varlociraptor=8.12.0
  - bioconda::htslib=1.21
  - bioconda::samtools=1.21
  - bioconda::bcftools=1.23.1
